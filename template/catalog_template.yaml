  代碼表:
    frozen_rows: 1
    columns: ["Type", "Code", "Meaning", "Usage"]
    rows:
      - ["Status", "INBOX", "尚未閱讀", "新進文獻"]
      - ["Status", "QUICK_READ", "完成淺讀，等待判斷", "Stage 1"]
      - ["Status", "APPROVED", "使用者認為值得深入", "Human Gate 通過"]
      - ["Status", "FULL_ANALYSIS", "完成完整分析", "Stage 2"]
      - ["Status", "CORE", "核心文獻", "研究主線"]
      - ["Status", "SUPPORTING", "重要支持文獻", "研究支援"]
      - ["Status", "BACKGROUND", "背景文獻", "背景脈絡"]
      - ["Status", "REVIEW_LATER", "目前不急", "稍後處理"]
      - ["Status", "REJECTED", "目前不納入研究主線", "保留原檔"]
      - ["Role", "CORE", "核心", "直接支持研究"]
      - ["Role", "SUPPORTING", "支持", "補強證據"]
      - ["Role", "METHOD", "方法", "研究設計依據"]
      - ["Role", "THEORY", "理論", "理論基礎"]
      - ["Role", "CONTRARY", "反方", "相反或挑戰證據"]
      - ["Role", "BACKGROUND", "背景", "脈絡資訊"]
      - ["Role", "REFERENCE", "參考", "工具或資源"]
      - ["Evidence", "✅", "論文明確支持", "直接證據"]
      - ["Evidence", "⚠️", "部分支持或合理推論", "降低結論強度"]
      - ["Evidence", "⏳", "尚待查證", "待補來源"]
      - ["Evidence", "❓", "論文未提供", "不得補完"]
      - ["Evidence", "❌", "論文明確否定", "反證"]
      - ["Evidence", "❗", "來源或結果衝突", "保留衝突"]

  README:
    columns: ["項目", "說明"]
    rows:
      - ["用途", "私人研究圖書館總書目；查找館藏時先查總書目，再開啟原始 PDF 或分析檔。"]
      - ["Paper_ID", "全館唯一，格式 P0001；封存後也不得回收編號。"]
      - ["索書號", "RLC-{class}-{year}-{first_author}-{paper_id}"]
      - ["分類", "一篇文獻一個 Primary Class，可有 0–3 個 Secondary Classes；原始 PDF 不重複存放。"]
      - ["流程", "INBOX → QUICK_READ HTML → 人工判斷 → FULL_ANALYSIS → CORE/SUPPORTING/BACKGROUND 等角色。"]
      - ["子分類資料夾", "按需建立；第一次有論文歸入該子類時再建立，以避免大量空資料夾。"]
      - ["正式紀錄", "Google Drive 館藏與本總書目是正式紀錄；聊天記憶只作工作脈絡。"]
      - ["自動化", "每次新文獻進入時：查重→Paper_ID→分類→HTML淺讀→更新總書目；通過 Human Gate 後才做完整分析。"]
