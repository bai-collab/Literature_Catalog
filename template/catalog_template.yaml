version: "1.0"
name: "00_總書目索引_Literature_Catalog"
type: "google_spreadsheet_template"
locale: "zh_TW"
timezone: "Asia/Taipei"

privacy:
  copy_existing_catalog_rows: false
  include_personal_information: false
  include_source_drive_ids_or_urls: false
  rule: >
    此模板只保存欄位、分類、代碼與一般說明；
    初始化時「總書目」只能建立標題列，不得搬移任何既有館藏資料列。

sheets:
  總書目:
    frozen_rows: 1
    columns:
      - Paper_ID
      - Call_Number
      - Primary_Class
      - Secondary_Classes
      - Status
      - Role
      - Title
      - Authors
      - First_Author
      - Year
      - Journal_or_Conference
      - DOI
      - Official_URL
      - Keywords
      - Research_Topic
      - Research_Design
      - Sample_or_Dataset
      - AI_Model_or_System
      - Related_RQ
      - Research_Fit_1_to_5
      - Evidence_Strength
      - Core_Finding
      - Main_Limitation
      - Source_PDF_Link
      - Quick_Read_Source_Link
      - Quick_Read_Link
      - Full_Analysis_Link
      - Added_Date
      - Last_Updated
      - Notes
    data_rows: []

